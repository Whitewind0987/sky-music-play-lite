name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm run test -- --testTimeout=30000

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Frontend build
        run: npm run build

  rust:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-01
        with:
          toolchain: stable

      - name: Identify Rust compiler
        id: rust-cache
        shell: pwsh
        run: |
          $compiler = rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { throw "Could not identify the Rust compiler." }
          $bytes = [System.Text.Encoding]::UTF8.GetBytes(($compiler -join " "))
          $fingerprint = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "compiler=$fingerprint" >> $env:GITHUB_OUTPUT

      # Shared with CI/Release; no commit key or fallback to a different compiler.
      # GitHub ref scopes prevent tag runs from restoring PR merge-ref caches.
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            !src-tauri/target/**/bundle/**
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.compiler }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.compiler }}-

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test
