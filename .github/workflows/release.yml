name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.versions.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-01
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and application versions
        id: versions
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersionMatch = Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1

          if ($null -eq $cargoVersionMatch) {
            throw "Could not read the package version from src-tauri/Cargo.toml."
          }

          $cargoVersion = $cargoVersionMatch.Matches[0].Groups[1].Value
          $expectedTag = "v$packageVersion"

          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag ${{ github.ref_name }} does not match package version $packageVersion."
          }

          if ($tauriVersion -ne $packageVersion -or $cargoVersion -ne $packageVersion) {
            throw "Version mismatch: package.json=$packageVersion, tauri.conf.json=$tauriVersion, Cargo.toml=$cargoVersion."
          }

          "version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Frontend tests
        run: npm run test -- --testTimeout=30000

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Frontend build
        run: npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Build and stage normal NSIS installer
        shell: pwsh
        run: |
          $nsisDirectory = Join-Path $PWD "src-tauri\target\release\bundle\nsis"
          $stagingDirectory = Join-Path $PWD "release-artifacts"

          if (Test-Path -LiteralPath $stagingDirectory) {
            Remove-Item -LiteralPath $stagingDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stagingDirectory | Out-Null

          if (Test-Path -LiteralPath $nsisDirectory) {
            Remove-Item -LiteralPath $nsisDirectory -Recurse -Force
          }

          npm run tauri -- build --bundles nsis --ci
          if ($LASTEXITCODE -ne 0) {
            throw "The normal Tauri NSIS build failed with exit code $LASTEXITCODE."
          }

          $installers = @(Get-ChildItem -LiteralPath $nsisDirectory -File -Filter "*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one normal NSIS installer in $nsisDirectory, found $($installers.Count)."
          }

          $destination = Join-Path $stagingDirectory "SkyMusicPlay-Lite_${{ steps.versions.outputs.version }}_Windows-x64_Setup.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $destination

          if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) {
            throw "Failed to stage the normal NSIS installer at $destination."
          }

          Remove-Item -LiteralPath $nsisDirectory -Recurse -Force

      - name: Build and stage offline WebView2 NSIS installer
        shell: pwsh
        run: |
          $nsisDirectory = Join-Path $PWD "src-tauri\target\release\bundle\nsis"
          $stagingDirectory = Join-Path $PWD "release-artifacts"

          if (Test-Path -LiteralPath $nsisDirectory) {
            Remove-Item -LiteralPath $nsisDirectory -Recurse -Force
          }

          npm run tauri -- build --bundles nsis --config src-tauri/tauri.offline.conf.json --ci
          if ($LASTEXITCODE -ne 0) {
            throw "The offline WebView2 Tauri NSIS build failed with exit code $LASTEXITCODE."
          }

          $installers = @(Get-ChildItem -LiteralPath $nsisDirectory -File -Filter "*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one offline WebView2 NSIS installer in $nsisDirectory, found $($installers.Count)."
          }

          $destination = Join-Path $stagingDirectory "SkyMusicPlay-Lite_${{ steps.versions.outputs.version }}_Windows-x64_WebView2-Offline_Setup.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $destination

          if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) {
            throw "Failed to stage the offline WebView2 NSIS installer at $destination."
          }

          Remove-Item -LiteralPath $nsisDirectory -Recurse -Force

      - name: Stage and verify release inputs
        shell: pwsh
        run: |
          $stagingDirectory = Join-Path $PWD "release-artifacts"
          Copy-Item -LiteralPath ".github\release-notes.md" -Destination (Join-Path $stagingDirectory "release-notes.md")

          $expectedNames = @(
            "SkyMusicPlay-Lite_${{ steps.versions.outputs.version }}_Windows-x64_Setup.exe",
            "SkyMusicPlay-Lite_${{ steps.versions.outputs.version }}_Windows-x64_WebView2-Offline_Setup.exe",
            "release-notes.md"
          )
          $actualNames = @(Get-ChildItem -LiteralPath $stagingDirectory -File | ForEach-Object Name)
          $missingNames = @($expectedNames | Where-Object { $_ -notin $actualNames })
          $unexpectedNames = @($actualNames | Where-Object { $_ -notin $expectedNames })

          if ($missingNames.Count -gt 0 -or $unexpectedNames.Count -gt 0) {
            throw "Invalid release staging contents. Missing: $($missingNames -join ', '); unexpected: $($unexpectedNames -join ', ')."
          }

      - name: Upload release workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-artifacts
          if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download release workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Verify downloaded release inputs
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $PWD "release-artifacts"
          $expectedNames = @(
            "SkyMusicPlay-Lite_${{ needs.build.outputs.version }}_Windows-x64_Setup.exe",
            "SkyMusicPlay-Lite_${{ needs.build.outputs.version }}_Windows-x64_WebView2-Offline_Setup.exe",
            "release-notes.md"
          )
          $actualNames = @(Get-ChildItem -LiteralPath $artifactDirectory -File | ForEach-Object Name)
          $missingNames = @($expectedNames | Where-Object { $_ -notin $actualNames })
          $unexpectedNames = @($actualNames | Where-Object { $_ -notin $expectedNames })

          if ($missingNames.Count -gt 0 -or $unexpectedNames.Count -gt 0) {
            throw "Invalid downloaded release contents. Missing: $($missingNames -join ', '); unexpected: $($unexpectedNames -join ', ')."
          }

      - name: Create or reuse draft and publish completed release
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $title = "SkyMusicPlay Lite $tag"
          $artifactDirectory = Join-Path $PWD "release-artifacts"
          $notesPath = Join-Path $artifactDirectory "release-notes.md"
          $normalInstaller = Join-Path $artifactDirectory "SkyMusicPlay-Lite_${{ needs.build.outputs.version }}_Windows-x64_Setup.exe"
          $offlineInstaller = Join-Path $artifactDirectory "SkyMusicPlay-Lite_${{ needs.build.outputs.version }}_Windows-x64_WebView2-Offline_Setup.exe"
          $encodedTag = [Uri]::EscapeDataString($tag)
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = $null

          try {
            $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$encodedTag" `
              -Headers $headers
          } catch {
            $statusCode = [int]$_.Exception.Response.StatusCode
            if ($statusCode -ne 404) {
              throw
            }
          }

          if ($null -eq $release) {
            gh release create $tag `
              --draft `
              --verify-tag `
              --title $title `
              --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create draft release for $tag."
            }
          } elseif (-not $release.draft) {
            throw "Release $tag is already published; refusing to replace or republish it."
          }

          gh release edit $tag `
            --title $title `
            --notes-file $notesPath `
            --draft=true
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update draft release metadata for $tag."
          }

          gh release upload $tag `
            $normalInstaller `
            $offlineInstaller `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release assets for $tag."
          }

          gh release edit $tag `
            --title $title `
            --notes-file $notesPath `
            --draft=false
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish completed release $tag."
          }
